name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        default: all
        options: [all, checks, install, distros]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Find out whether code changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Treat documentation-only changes as no code change
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if [[ -n $BASE && $BASE != 0000000000000000000000000000000000000000 ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qvE '^(docs/|LICENSE$)|\.md$'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'checks'
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compile the Python sources
        run: git ls-files -z '*.py' | xargs -0 python3 -m py_compile

      - name: Check the shell scripts
        run: |
          scripts=(install.sh uninstall.sh bin/* packaging/*.sh packaging/system-update packaging/*.zypp tests/install/*.sh)
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          shellcheck -x -S warning "${scripts[@]}"

  distros:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'distros')
    name: Install dependencies and build on ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arch Linux
            image: archlinux:latest
            plasma: pacman -Syu --noconfirm git plasma-desktop
          - name: SteamOS 3.9
            image: archlinux:latest
            plasma: |
              repos="jupiter-3.9 holo-3.9 core-3.9 extra-3.9 multilib-3.9"
              conf() {
                printf '[options]\nArchitecture = auto\nSigLevel = %s\nLocalFileSigLevel = Optional\n' "$1"
                for repo in $repos; do printf '[%s]\nServer = https://steamdeck-packages.steamos.cloud/archlinux-mirror/$repo/os/$arch\n' "$repo"; done
              }
              conf Never > /etc/pacman-bootstrap.conf
              pacman -Sy --noconfirm --config /etc/pacman-bootstrap.conf holo-keyring
              pacman-key --init
              pacman-key --populate archlinux holo
              conf "Required DatabaseOptional" > /etc/pacman.conf
              pacman -Syuu --noconfirm --ignore filesystem
              pacman -S --noconfirm --needed git plasma-desktop
          - name: Fedora 44
            image: fedora:44
            plasma: dnf install -y git plasma-desktop
          - name: openSUSE Tumbleweed
            image: opensuse/tumbleweed
            plasma: zypper --non-interactive dup --allow-downgrade && zypper --non-interactive install --force-resolution git plasma6-desktop
          - name: Debian testing
            image: debian:testing
            plasma: apt-get update && apt-get install -y git plasma-desktop
    container:
      image: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install Plasma
        run: ${{ matrix.plasma }}

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install the voice changer's dependencies
        run: packaging/dependencies.sh

      - name: Check the commands, QML modules and Python runtime
        shell: bash
        run: |
          for command_name in python3 pw-dump pw-loopback pw-link pw-cat pactl kpackagetool6 curl gdbus git; do
            command -v "$command_name"
          done
          for module in org/kde/kquickcontrols Qt/labs/folderlistmodel QtQuick/Shapes; do
            find /usr -path "*/qml/$module/qmldir" | grep .
          done
          python3 -m venv /tmp/venv
          /tmp/venv/bin/python -m pip --version
          [[ -z $(packaging/dependencies.sh) ]]

  install:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'install')
    name: Install, check and uninstall on Arch Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Give KWin a vgem render node, so it composites with OpenGL on Mesa's llvmpipe
        run: tests/install/vgem.sh

      - name: Install, check and uninstall the voice changer in a Plasma session
        run: tests/install/run.sh
