<g><rect x="330" y="466" width="260" height="74" rx="16" fill="#ffffff" stroke="#cfd9ea" stroke-width="1.5"/><rect x="346" y="484" width="4" height="38" rx="2" fill="#f0a53a"/><text x="364" y="499.0" class="ct" fill="#10172a">App translation</text><text x="364" y="521.0" class="cs" fill="#5a6784">to the language you pick</text></g>
<g><rect x="644" y="466" width="270" height="74" rx="16" fill="#ffffff" stroke="#cfd9ea" stroke-width="1.5"/><rect x="660" y="484" width="4" height="38" rx="2" fill="#3daee9"/><text x="678" y="499.0" class="ct" fill="#10172a">Your output</text><text x="678" y="521.0" class="cs" fill="#5a6784">translated speech on top</text></g>
<text x="940" y="499.0" class="cs" fill="#5a6784">The app keeps playing as usual.</text>
