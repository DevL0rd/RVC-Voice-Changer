<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f9fe"/><stop offset="1" stop-color="#e6eef9"/></linearGradient>
<clipPath id="clip"><rect width="1280" height="560" rx="24"/></clipPath><style>
.ct{font:700 19px 'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.cs{font:500 14px 'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.sec{font:700 13px 'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;letter-spacing:2px}.pl{font:700 14px 'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.ap{font:600 14px 'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.flow{animation:flow .9s linear infinite}@keyframes flow{to{stroke-dashoffset:-18}}
.on{animation:on 10s ease-in-out infinite}@keyframes on{0%,46%{opacity:1}50%,96%{opacity:0}100%{opacity:1}}
.off{animation:off 10s ease-in-out infinite}@keyframes off{0%,46%{opacity:0}50%,96%{opacity:1}100%{opacity:0}}
.dim{animation:dim 10s ease-in-out infinite}@keyframes dim{0%,46%{opacity:1}50%,96%{opacity:.35}100%{opacity:1}}
</style></defs>
<g clip-path="url(#clip)">
